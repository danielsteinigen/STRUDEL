engine:
  model: google/gemma-3-12b-it
  trust_remote_code: true
  max_model_len: 16384
  max_num_seqs: 256
  tensor_parallel_size: 1
  limit_mm_per_prompt:
    image: 1
    video: 0
  mm_processor_kwargs:
    use_fast: true
    do_pan_and_scan: true

sampling:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 16384

generation:
  request_builder: template_string
  template: |
    <bos><start_of_turn>user
    {system}

    <start_of_image>{user}<end_of_turn>
    <start_of_turn>model