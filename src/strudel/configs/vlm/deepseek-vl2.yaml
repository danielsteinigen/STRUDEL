engine:
  model: deepseek-ai/deepseek-vl2-small
  trust_remote_code: true
  max_model_len: 4096
  max_num_seqs: 256
  tensor_parallel_size: 1
  limit_mm_per_prompt:
    image: 1
    video: 0
  hf_overrides:
    architectures:
      - DeepseekVLV2ForCausalLM

sampling:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 4096

generation:
  request_builder: template_string
  template: |
    <|User|>: <image>
    {system}
    {user}

    <|Assistant|>: