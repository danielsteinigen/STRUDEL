engine:
  model: facebook/chameleon-7b
  trust_remote_code: true
  max_model_len: 4096
  max_num_seqs: 256
  tensor_parallel_size: 1
  limit_mm_per_prompt:
    image: 1
    video: 0

sampling:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 4096

generation:
  request_builder: template_string
  template: |
    {system}
    {user}<image>