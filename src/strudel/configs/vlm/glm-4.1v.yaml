engine:
  model: zai-org/GLM-4.1V-9B-Thinking
  trust_remote_code: true
  max_model_len: 16384
  max_num_seqs: 256
  tensor_parallel_size: 1
  limit_mm_per_prompt:
    image: 1
    video: 0
  gpu_memory_utilization: 0.95
  enforce_eager: true
  mm_processor_kwargs:
    size:
      shortest_edge: 12544
      longest_edge: 47040000
    fps: 1

sampling:
  temperature: 0.2
  top_p: 0.95
  max_tokens: 16384

generation:
  request_builder: template_string
  template: |
    [gMASK]<sop><|system|>
    {system}<|user|>
    <|begin_of_image|><|image|><|end_of_image|>{user}<|assistant|>assistant